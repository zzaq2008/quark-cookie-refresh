# 夸克 cookie 自动刷新 —— 飞牛 Docker Compose 一键版 v2（单文件，无需上传脚本）
# v2 2026-09-30：换 slim 底包 + 全链路国内镜像，解决 2GB 镜像一晚上拉不下来问题；
# 并修复 v1 的两个 bug：定时任务读不到环境变量、首次未登录时脚本提前退出。
#
# 使用方法：
# 1. 先把删掉：飞牛「Docker → Compose」选中旧的 quark-refresh 项目 → 删除
# （不删会报容器名冲突；旧的 2GB 镜像没下完也可以在「镜像」里删掉省空间）
# 2. 把 OPENLIST_PASS 改成你的 OpenList 管理员密码（保留引号）
#    （若忘记密码：给 OpenList 容器加环境变量 OPENLIST_ADMIN_PASSWORD=新密码 后重启）
# 3. 确认 OPENLIST_URL 能连上你的 OpenList（OpenList 装在同一台飞牛上就不用改）
# 4. 在飞牛「Docker → Compose → 新增项目」里粘贴本文件，启动
# 5. 首次启动会自动装依赖（约 300MB，走国内镜像，几分钟），然后尝试刷新；
# 若提示扫码，去宿主机 /your/path/quark-refresh/logs/qr.png（按下表路径改后的实际位置），用夸克 App 扫码
# 6. 在容器日志里看到「完成」或「已是最新」即成功，之后每天凌晨3点（北京时间）自动跑
#
# 实在拉不动底包时，把下面 image 那行换成：image: python:3.12-slim-bookworm
name: quark-refresh
services:
  quark-refresh:
    image: docker.m.daocloud.io/library/python:3.12-slim-bookworm
    container_name: quark-refresh
    restart: unless-stopped
    network_mode: host   # 让 127.0.0.1 能直连本机 OpenList
    environment:
      TZ: Asia/Shanghai
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
      OPENLIST_URL: http://127.0.0.1:5244
      OPENLIST_USER: admin
      OPENLIST_PASS: 请改成你的OpenList管理员密码
      QUARK_MOUNT_PATH: /夸克网盘
      QUARK_PROFILE_DIR: /root/.quark-profile
    volumes:
    - /your/path/quark-refresh/profile:/root/.quark-profile
    - /your/path/quark-refresh/logs:/var/log/quark-refresh
    - /your/path/quark-refresh/ms-playwright:/root/.cache/ms-playwright
    command:
    - bash
    - -c
    - "set -e\necho \"=== [quark-refresh] v8 2026-09-30 (多夸克存储全更新) 容器启动 ===\"\nmkdir -p /opt/quark-refresh /root/.config/quark-refresh /var/log/quark-refresh /root/.cache/ms-playwright\n\n# ---- 0. 落盘环境变量：cron 的环境是空的，定时任务靠这个文件 ----\n{\n printf 'PATH=%q\\n' '/usr/local/bin:/usr/bin:/bin'\n printf 'TZ=%q\\n' \"$${TZ:-Asia/Shanghai}\"\n printf 'PLAYWRIGHT_BROWSERS_PATH=%q\\n' '/root/.cache/ms-playwright'\n printf 'OPENLIST_URL=%q\\n' \"$${OPENLIST_URL:-http://127.0.0.1:5244}\"\n printf 'OPENLIST_USER=%q\\n' \"$${OPENLIST_USER:-admin}\"\n printf 'OPENLIST_PASS=%q\\n' \"$${OPENLIST_PASS:-}\"\n printf 'QUARK_MOUNT_PATH=%q\\n' \"$${QUARK_MOUNT_PATH:-/夸克网盘}\"\n printf 'QUARK_PROFILE_DIR=%q\\n' \"$${QUARK_PROFILE_DIR:-/root/.quark-profile}\"\n} > /root/.config/quark-refresh/env\nchmod 600 /root/.config/quark-refresh/env\n\n# ---- 1. apt 换清华源（只换一次）----\nif ! grep -q 'mirrors.tuna.tsinghua.edu.cn' /etc/apt/sources.list.d/debian.sources 2>/dev/null; then\n cat > /etc/apt/sources.list.d/debian.sources <<'APT_EOF'\nTypes: deb\nURIs: https://mirrors.tuna.tsinghua.edu.cn/debian/\nSuites: bookworm bookworm-updates\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\n\nTypes: deb\nURIs: https://mirrors.tuna.tsinghua.edu.cn/debian-security/\nSuites: bookworm-security\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\nAPT_EOF\n rm -f /etc/apt/sources.list\n echo \"[apt] 已切换清华源\"\nfi\n\n# ---- 2. 装 tzdata + cron（幂等），时区设为北京时间 ----\nif ! command -v cron >/dev/null 2>&1 || [ ! -f /usr/share/zoneinfo/Asia/Shanghai ]; then\n apt-get update -qq\n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends tzdata cron\n rm -rf /var/lib/apt/lists/*\nfi\nln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime 2>/dev/null || true\n\n# ---- 3. pip 装 playwright + requests（幂等，走清华源）----\nexport PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright\nif ! python3 -c 'import playwright, requests' 2>/dev/null; then\n pip install --quiet --break-system-packages -i https://pypi.tuna.tsinghua.edu.cn/simple 'playwright==1.48.0' requests\n echo \"[pip] playwright/requests 安装完成\"\nfi\n\n# ---- 4. Chromium 系统依赖（装在容器层，容器重建就丢，每次启动都装一遍，已装过会秒过）----\napt-get update -qq\npython3 -m playwright install-deps chromium\nrm -rf /var/lib/apt/lists/*\necho \"[playwright] 系统依赖就绪\"\n\n# ---- 4b. Chromium 本体（进持久卷，只下载一次，走 npmmirror）----\nif ! ls -d /root/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then\n PLAYWRIGHT_DOWNLOAD_HOST='https://npmmirror.com/mirrors/playwright/' \\\n python3 -m playwright install chromium\n echo \"[playwright] chromium 下载完成\"\nfi\n\n# ---- 5. 还原内嵌脚本 ----\necho ''\
      \ | base64 -d > /opt/quark-refresh/refresh_quark_cookie.py\necho ''\
      \ | base64 -d > /opt/quark-refresh/quark_login_qr.py\necho '' | base64 -d > /etc/cron.d/quark-refresh\nchmod 0644 /etc/cron.d/quark-refresh\n\n# ---- 6. 首次启动：先尝试刷新一次 ----\necho \"=== 首次启动：先尝试刷新一次 ===\"\nset +e\npython3 /opt/quark-refresh/refresh_quark_cookie.py\nrc=$$?\nset -e\nif [ \"$$rc\" -eq 2 ]; then\n echo \"=== 夸克未登录，正在生成扫码二维码 ===\"\n echo \"=== 请在飞牛「文件管理」打开 Docker/quark-refresh/logs/qr.png，用夸克 App 扫码 ===\"\n set +e\n python3 /opt/quark-refresh/quark_login_qr.py\n lrc=$$?\n set -e\n if [ \"$$lrc\" -eq 0 ]; then\n python3 /opt/quark-refresh/refresh_quark_cookie.py || true\n fi\nfi\necho \"=== 启动定时任务（每天凌晨3点，北京时间）===\"\nexec cron -f\n"
